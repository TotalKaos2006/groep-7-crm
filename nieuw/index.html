<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="page">
        <header class="topbar">
            <h1>LOGO</h1>
            <div class="actions">
                <button>ADD</button>
                <button>DELETE</button>
                <button>ARCHIVE</button>
                <input type="search" placeholder="Zoek">
            </div>
        </header>

        <section class="card">
            <table>
                <thead>
                    <tr>
                        <th>Klantgegevens + ID</th>
                        <th>Medewerker</th>
                        <th>Opdracht</th>
                        <th>Uren</th>
                    </tr>
                </thead>
                <tbody>
                    <tr><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td></tr>
                    <tr><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td></tr>
                    <tr><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td></tr>
                    <tr><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td></tr>
                    <tr><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td></tr>
                </tbody>
            </table>

            <div class="mysql">MYSQL DATABASE COMMANDS</div>
        </section>

        <footer>
            <div class="footer-left">
                <div class="brand">LOGO</div>
                <nav class="footer-links">
                    <a href="#">Link one</a>
                    <a href="#">Link two</a>
                    <a href="#">Link three</a>
                    <a href="#">Link four</a>
                </nav>
            </div>

            <div class="socials">
                <a href="#" aria-label="Instagram">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7"/><circle cx="17.5" cy="6.5" r="1.5"/></svg>
                </a>
                <a href="#" aria-label="Facebook">
